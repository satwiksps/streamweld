<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Streamweld — one generation, exact resume</title>
  <desc id="description">OpenAI-compatible durability for self-hosted inference: journal each response, continue safely after a backend failure, and resume clients from an exact cursor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0d1a2b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#172033" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#6ee7b7"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <g transform="translate(80 72)">
    <rect width="42" height="42" rx="10" fill="#0f1d30" stroke="#31537f"/>
    <path d="M10 22h8l5-10 7 20 4-10h7" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="32" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">Streamweld</text>
  </g>

  <g transform="translate(80 190)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="0" fill="#93c5fd" font-family="SFMono-Regular,Consolas,monospace" font-size="18" font-weight="650" letter-spacing="2.4">DURABLE STREAMING FOR SELF-HOSTED INFERENCE</text>
    <text x="0" y="82" fill="#f8fafc" font-size="61" font-weight="700" letter-spacing="-2">One generation.</text>
    <text x="0" y="150" fill="#a8b3c4" font-size="61" font-weight="700" letter-spacing="-2">Exact resume.</text>
    <text x="0" y="211" fill="#94a3b8" font-size="20">Journal every committed event. Continue only when safe.</text>
  </g>

  <g transform="translate(700 150)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="0" y="80" width="110" height="68" rx="11" fill="#111827" stroke="#334155"/>
    <text x="55" y="106" fill="#94a3b8" font-size="10" text-anchor="middle" letter-spacing="1.2">CLIENT</text>
    <text x="55" y="132" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">Your app</text>

    <path d="M110 114H164" fill="none" stroke="url(#signal)" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="137" y="101" fill="#93a4ba" font-family="SFMono-Regular,Consolas,monospace" font-size="8" text-anchor="middle">OPENAI + SSE</text>

    <rect x="175" y="64" width="155" height="100" rx="13" fill="#0f1d30" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="252.5" y="94" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.2">STREAMWELD</text>
    <text x="252.5" y="124" fill="#f8fafc" font-size="16" font-weight="600" text-anchor="middle">Proxy</text>
    <text x="252.5" y="148" fill="#94a3b8" font-size="11" text-anchor="middle">identity + recovery</text>

    <path d="M252.5 164V210" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="190" y="210" width="125" height="50" rx="10" fill="#111827" stroke="#334155"/>
    <text x="252.5" y="231" fill="#94a3b8" font-size="9" text-anchor="middle" letter-spacing="1">JOURNAL</text>
    <text x="252.5" y="249" fill="#6ee7b7" font-family="SFMono-Regular,Consolas,monospace" font-size="11" text-anchor="middle">40 · 41 · 42</text>

    <path d="M330 94H356V62H381" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-red)"/>
    <rect x="385" y="30" width="115" height="64" rx="10" fill="#16151a" stroke="#7f1d1d"/>
    <text x="442.5" y="56" fill="#94a3b8" font-size="9" text-anchor="middle" letter-spacing="1">ATTEMPT 1</text>
    <text x="442.5" y="80" fill="#fda4af" font-size="13" font-weight="600" text-anchor="middle">failed ×</text>

    <path d="M330 134H356V162H381" fill="none" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow-green)"/>
    <rect x="385" y="130" width="115" height="64" rx="10" fill="#10201f" stroke="#166534"/>
    <text x="442.5" y="156" fill="#94a3b8" font-size="9" text-anchor="middle" letter-spacing="1">ATTEMPT 2</text>
    <text x="442.5" y="180" fill="#6ee7b7" font-size="13" font-weight="600" text-anchor="middle">continues ✓</text>

    <path d="M190 235H55V152" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-blue)"/>
    <text x="122" y="222" fill="#93a4ba" font-family="SFMono-Regular,Consolas,monospace" font-size="9" text-anchor="middle">RESUME AFTER 41</text>
  </g>

  <line x1="80" y1="558" x2="1200" y2="558" stroke="#26364e"/>
  <text x="80" y="596" fill="#94a3b8" font-family="SFMono-Regular,Consolas,monospace" font-size="16">OPENAI HTTP + SSE  ·  MEMORY OR REDIS JOURNAL  ·  KUBERNETES-NATIVE</text>
</svg>
