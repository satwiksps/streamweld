<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Streamweld — keep the response</title>
  <desc id="description">Durable token streams for self-hosted inference through disconnects and eligible backend failures.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0d1a2b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d6ff"/>
      <stop offset="1" stop-color="#80f0b5"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>

  <g transform="translate(80 70)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="44" height="44" rx="11" fill="#0f1d30" stroke="#31537f"/>
    <path d="M9 23h8l5-11 8 22 5-11h7" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="33" fill="#f8fafc" font-size="31" font-weight="700">Streamweld</text>
  </g>

  <g transform="translate(80 200)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="0" fill="#93c5fd" font-family="SFMono-Regular,Consolas,monospace" font-size="18" font-weight="600" letter-spacing="2.2">DURABLE TOKEN STREAMS FOR SELF-HOSTED INFERENCE</text>
    <text x="0" y="92" fill="#f8fafc" font-size="72" font-weight="700" letter-spacing="-2.5">Keep the response.</text>
    <text x="0" y="154" fill="#a8b3c4" font-size="27">Through disconnects and eligible backend failures.</text>
  </g>

  <g transform="translate(844 126)">
    <rect width="310" height="310" rx="66" fill="#0a1728" stroke="#28485b" stroke-width="2"/>
    <circle cx="155" cy="155" r="112" fill="none" stroke="#1d3448" stroke-width="2"/>
    <circle cx="155" cy="155" r="72" fill="none" stroke="#1d3448" stroke-width="2"/>
    <path d="M36 155H76C96 155 96 110 117 110s21 90 42 90 21-90 42-90 21 45 42 45h31"
          fill="none" stroke="url(#signal)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)"/>
    <circle cx="159" cy="200" r="13" fill="#0a1728" stroke="#d7f7ff" stroke-width="5"/>
    <circle cx="159" cy="200" r="5" fill="#80f0b5"/>
  </g>

  <line x1="80" y1="558" x2="1200" y2="558" stroke="#26364e"/>
  <text x="80" y="598" fill="#94a3b8" font-family="SFMono-Regular,Consolas,monospace" font-size="16">OPENAI-COMPATIBLE  ·  KUBERNETES-NATIVE  ·  MEMORY OR REDIS</text>
</svg>
