<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Streamweld — one generation, exact resume</title>
  <desc id="description">OpenAI-compatible durability for self-hosted inference: journal each response, continue safely after a backend failure, and resume clients from an exact cursor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0d1a2b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#172033" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 4.5 0 9Z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>

  <g transform="translate(80 72)">
    <rect width="42" height="42" rx="10" fill="#0f1d30" stroke="#31537f"/>
    <path d="M10 22h8l5-10 7 20 4-10h7" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="32" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="760">Streamweld</text>
  </g>

  <g transform="translate(80 190)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="0" fill="#93c5fd" font-family="SFMono-Regular,Consolas,monospace" font-size="18" font-weight="650" letter-spacing="2.4">DURABLE STREAMING FOR SELF-HOSTED INFERENCE</text>
    <text x="0" y="82" fill="#f8fafc" font-size="61" font-weight="780" letter-spacing="-2">One generation.</text>
    <text x="0" y="150" fill="#a8b3c4" font-size="61" font-weight="720" letter-spacing="-2">Exact resume.</text>
    <text x="0" y="211" fill="#94a3b8" font-size="20">Journal every committed event. Continue only when safe.</text>
  </g>

  <g transform="translate(745 155)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="0" y="75" width="105" height="62" rx="11" fill="#111827" stroke="#334155"/>
    <text x="52.5" y="99" fill="#94a3b8" font-size="10" text-anchor="middle" letter-spacing="1.2">CLIENT</text>
    <text x="52.5" y="122" fill="#f8fafc" font-size="15" font-weight="650" text-anchor="middle">Your app</text>

    <path d="M105 106H165" fill="none" stroke="url(#signal)" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="176" y="61" width="151" height="90" rx="13" fill="#0f1d30" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="251.5" y="88" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.2">STREAMWELD</text>
    <text x="251.5" y="116" fill="#f8fafc" font-size="16" font-weight="650" text-anchor="middle">Proxy</text>
    <text x="251.5" y="137" fill="#94a3b8" font-size="11" text-anchor="middle">identity + recovery</text>

    <path d="M251.5 151V193" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="188" y="193" width="127" height="48" rx="10" fill="#111827" stroke="#334155"/>
    <text x="251.5" y="213" fill="#94a3b8" font-size="9" text-anchor="middle" letter-spacing="1">JOURNAL</text>
    <text x="251.5" y="231" fill="#6ee7b7" font-family="SFMono-Regular,Consolas,monospace" font-size="11" text-anchor="middle">40 · 41 · 42</text>

    <path d="M327 92H371" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="373" y="18" width="119" height="58" rx="10" fill="#16151a" stroke="#7f1d1d"/>
    <text x="432.5" y="42" fill="#94a3b8" font-size="9" text-anchor="middle" letter-spacing="1">BACKEND A</text>
    <text x="432.5" y="64" fill="#fda4af" font-size="13" font-weight="650" text-anchor="middle">failed ×</text>

    <path d="M327 123H371" fill="none" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="373" y="94" width="119" height="64" rx="10" fill="#10201f" stroke="#166534"/>
    <text x="432.5" y="119" fill="#94a3b8" font-size="9" text-anchor="middle" letter-spacing="1">BACKEND B</text>
    <text x="432.5" y="143" fill="#6ee7b7" font-size="13" font-weight="650" text-anchor="middle">continues ✓</text>

    <path d="M188 217H52.5V139" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="104" y="205" fill="#93a4ba" font-family="SFMono-Regular,Consolas,monospace" font-size="10" text-anchor="middle">resume after 41</text>
  </g>

  <line x1="80" y1="558" x2="1200" y2="558" stroke="#26364e"/>
  <text x="80" y="596" fill="#94a3b8" font-family="SFMono-Regular,Consolas,monospace" font-size="16">OPENAI HTTP + SSE  ·  MEMORY OR REDIS JOURNAL  ·  KUBERNETES-NATIVE</text>
</svg>
