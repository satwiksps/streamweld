<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">Streamweld</title>
  <desc id="description">An application sends an OpenAI-compatible request through Streamweld. Streamweld journals the response, moves from a failed backend to a compatible backend, and lets the application resume from an exact cursor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#102239"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8Z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="960" height="260" rx="28" fill="url(#background)"/>
  <g transform="translate(42 55)">
    <text x="0" y="48" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="760" letter-spacing="-1.8">Streamweld</text>
    <text x="2" y="85" fill="#93c5fd" font-family="SFMono-Regular,Consolas,monospace" font-size="16" font-weight="600" letter-spacing="2">DURABLE LLM TOKEN STREAMS</text>
    <text x="2" y="128" fill="#a8b3c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">One generation. Exact resume.</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="501" y="88" width="98" height="54" rx="10" fill="#111827" stroke="#334155"/>
    <text x="550" y="110" fill="#94a3b8" font-size="10" text-anchor="middle" letter-spacing="1.2">CLIENT</text>
    <text x="550" y="130" fill="#f8fafc" font-size="14" font-weight="650" text-anchor="middle">Your app</text>

    <path d="M599 115H654" fill="none" stroke="url(#signal)" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="627" y="103" fill="#93a4ba" font-family="SFMono-Regular,Consolas,monospace" font-size="9" text-anchor="middle">SSE</text>

    <rect x="663" y="76" width="132" height="78" rx="12" fill="#0f1d30" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="729" y="101" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.2">STREAMWELD</text>
    <text x="729" y="124" fill="#f8fafc" font-size="14" font-weight="650" text-anchor="middle">Proxy</text>
    <text x="729" y="143" fill="#94a3b8" font-size="10" text-anchor="middle">identity + recovery</text>

    <path d="M729 154V183" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="670" y="183" width="118" height="38" rx="9" fill="#111827" stroke="#334155"/>
    <text x="729" y="200" fill="#94a3b8" font-size="9" text-anchor="middle" letter-spacing="1">JOURNAL</text>
    <text x="729" y="214" fill="#6ee7b7" font-family="SFMono-Regular,Consolas,monospace" font-size="10" text-anchor="middle">40 · 41 · 42</text>

    <path d="M795 105H824" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="826" y="51" width="94" height="48" rx="9" fill="#16151a" stroke="#7f1d1d"/>
    <text x="873" y="70" fill="#a8b3c4" font-size="9" text-anchor="middle" letter-spacing="1">BACKEND A</text>
    <text x="873" y="89" fill="#fda4af" font-size="12" font-weight="650" text-anchor="middle">failed ×</text>

    <path d="M795 126H824" fill="none" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="826" y="113" width="94" height="54" rx="9" fill="#10201f" stroke="#166534"/>
    <text x="873" y="133" fill="#a8b3c4" font-size="9" text-anchor="middle" letter-spacing="1">BACKEND B</text>
    <text x="873" y="153" fill="#6ee7b7" font-size="12" font-weight="650" text-anchor="middle">continues ✓</text>

    <path d="M670 204H550V144" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="591" y="194" fill="#93a4ba" font-family="SFMono-Regular,Consolas,monospace" font-size="9" text-anchor="middle">resume after 41</text>
  </g>
</svg>
