<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">Streamweld</title>
  <desc id="description">An application sends an OpenAI-compatible request through Streamweld. Streamweld journals the response, moves from a failed backend to a compatible backend, and lets the application resume from an exact cursor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#102239"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8Z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8Z" fill="#6ee7b7"/>
    </marker>
  </defs>

  <rect width="960" height="260" rx="28" fill="url(#background)"/>
  <g transform="translate(42 55)">
    <text x="0" y="48" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-1.8">Streamweld</text>
    <text x="2" y="85" fill="#93c5fd" font-family="SFMono-Regular,Consolas,monospace" font-size="16" font-weight="600" letter-spacing="2">DURABLE LLM TOKEN STREAMS</text>
    <text x="2" y="128" fill="#a8b3c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">One generation. Exact resume.</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="500" y="90" width="100" height="58" rx="10" fill="#111827" stroke="#334155"/>
    <text x="550" y="113" fill="#94a3b8" font-size="9" text-anchor="middle" letter-spacing="1.2">CLIENT</text>
    <text x="550" y="134" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Your app</text>

    <path d="M600 119H650" fill="none" stroke="url(#signal)" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="625" y="107" fill="#93a4ba" font-family="SFMono-Regular,Consolas,monospace" font-size="8" text-anchor="middle">OPENAI + SSE</text>

    <rect x="658" y="76" width="140" height="86" rx="12" fill="#0f1d30" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="728" y="102" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.2">STREAMWELD</text>
    <text x="728" y="127" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Proxy</text>
    <text x="728" y="148" fill="#94a3b8" font-size="10" text-anchor="middle">identity + recovery</text>

    <path d="M728 162V190" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="666" y="190" width="124" height="42" rx="9" fill="#111827" stroke="#334155"/>
    <text x="728" y="207" fill="#94a3b8" font-size="8" text-anchor="middle" letter-spacing="1">JOURNAL</text>
    <text x="728" y="223" fill="#6ee7b7" font-family="SFMono-Regular,Consolas,monospace" font-size="10" text-anchor="middle">40 · 41 · 42</text>

    <path d="M798 99H818V76H836" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-red)"/>
    <rect x="840" y="52" width="84" height="48" rx="9" fill="#16151a" stroke="#7f1d1d"/>
    <text x="882" y="71" fill="#a8b3c4" font-size="8" text-anchor="middle" letter-spacing="1">ATTEMPT 1</text>
    <text x="882" y="90" fill="#fda4af" font-size="12" font-weight="600" text-anchor="middle">failed ×</text>

    <path d="M798 139H818V162H836" fill="none" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow-green)"/>
    <rect x="840" y="138" width="84" height="48" rx="9" fill="#10201f" stroke="#166534"/>
    <text x="882" y="157" fill="#a8b3c4" font-size="8" text-anchor="middle" letter-spacing="1">ATTEMPT 2</text>
    <text x="882" y="176" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">continues ✓</text>

    <path d="M666 211H550V152" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-blue)"/>
    <text x="608" y="201" fill="#93a4ba" font-family="SFMono-Regular,Consolas,monospace" font-size="8" text-anchor="middle">RESUME AFTER 41</text>
  </g>
</svg>
