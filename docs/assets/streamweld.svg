<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">Streamweld</title>
  <desc id="description">Streamweld keeps one token stream continuous through a broken connection.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#102d35"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d6ff"/>
      <stop offset="1" stop-color="#80f0b5"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="260" rx="28" fill="url(#background)"/>

  <g transform="translate(38 28)">
    <rect x="0" y="0" width="204" height="204" rx="42" fill="#0a1728" stroke="#28485b" stroke-width="2"/>
    <circle cx="102" cy="102" r="72" fill="none" stroke="#1d3448" stroke-width="2"/>
    <circle cx="102" cy="102" r="45" fill="none" stroke="#1d3448" stroke-width="2"/>
    <path d="M24 102H48C61 102 61 73 75 73S89 131 103 131s14-58 28-58 14 29 28 29h21"
          fill="none" stroke="url(#signal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)"/>
    <circle cx="103" cy="131" r="8" fill="#0a1728" stroke="#d7f7ff" stroke-width="3"/>
    <circle cx="103" cy="131" r="3" fill="#80f0b5"/>
  </g>

  <g transform="translate(282 65)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="60" fill="#f5fbff" font-size="68" font-weight="700" letter-spacing="-2">Streamweld</text>
    <text x="4" y="108" fill="#96b8c6" font-family="SFMono-Regular,Consolas,monospace" font-size="22" font-weight="600" letter-spacing="2">ONE RESPONSE. EXACT RESUME.</text>
  </g>
</svg>
