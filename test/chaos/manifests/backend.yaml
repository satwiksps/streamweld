apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamweld-chaos-backend
  namespace: streamweld-system
  labels:
    app.kubernetes.io/name: streamweld-chaos-backend
    app.kubernetes.io/part-of: streamweld
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streamweld-chaos-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamweld-chaos-backend
        app.kubernetes.io/part-of: streamweld
        streamweld.io/model-version: deterministic-chaos-v1
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      nodeSelector:
        streamweld-chaos-role: backend
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: streamweld-chaos-backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: streamweld-chaos-backend:kind
          imagePullPolicy: Never
          env:
            - name: CHAOS_DEFAULT_TOKENS
              value: "64"
            - name: CHAOS_TOKEN_DELAY
              value: 12ms
            - name: CHAOS_TEMPLATE_MODE
              value: safe
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - >-
                    wget -q -O /dev/null --post-data=''
                    "http://streamweld-operator:8082/internal/backends/by-pod/${POD_NAMESPACE}/${POD_NAME}/drain"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: streamweld-chaos-backend
  namespace: streamweld-system
  labels:
    app.kubernetes.io/name: streamweld-chaos-backend
spec:
  selector:
    app.kubernetes.io/name: streamweld-chaos-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
