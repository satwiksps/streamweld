apiVersion: v1
kind: Service
metadata:
  name: streamweld-proxy-chaos-nodeport
  namespace: streamweld-system
  labels:
    app.kubernetes.io/name: streamweld
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: streamweld
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: streamweld
    app.kubernetes.io/component: proxy
    app.kubernetes.io/instance: streamweld
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
