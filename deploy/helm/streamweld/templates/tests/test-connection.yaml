apiVersion: v1
kind: Pod
metadata:
  name: {{ include "streamweld.testName" . }}
  labels:
    {{- include "streamweld.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: health
      image: busybox:1.37
      command: ["wget"]
      args:
        - -qO-
        - {{ printf "http://%s:%d/healthz" (include "streamweld.proxyName" .) (int .Values.proxy.service.port) | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
