{{- if .Values.operator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "streamweld.operatorName" . }}
  labels:
    {{- include "streamweld.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: ["streamweld.io"]
    resources: ["inferenceroutes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["streamweld.io"]
    resources: ["inferenceroutes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["streamweld.io"]
    resources: ["inferenceroutes/finalizers"]
    verbs: ["update"]
  - apiGroups: ["streamweld.io"]
    resources: ["durabilitypolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "streamweld.operatorName" . }}
  labels:
    {{- include "streamweld.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "streamweld.operatorName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "streamweld.operatorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
