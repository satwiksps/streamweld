version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Kolkata
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Keep the operator on the exact ADR-approved Kubernetes compatibility
    # set. These tightly coupled modules move together in a dedicated upgrade
    # after webhook, CRD, image, and kind validation.
    ignore:
      - dependency-name: sigs.k8s.io/controller-runtime
      - dependency-name: k8s.io/api
      - dependency-name: k8s.io/apiextensions-apiserver
      - dependency-name: k8s.io/apimachinery
      - dependency-name: k8s.io/client-go

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Kolkata
    groups:
      javascript:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # These majors change documented compatibility contracts and need their
    # own deliberate migration instead of an automated grouped update.
    ignore:
      - dependency-name: ai
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Kolkata

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Kolkata
