name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "apps/docs-site/**"
      - "docs/**"
      - "benchmarks/**"
      - "README.md"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs-site/**"
      - "docs/**"
      - "benchmarks/**"
      - "README.md"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Simulate Read the Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      READTHEDOCS_CANONICAL_URL: https://streamweld.readthedocs.io/en/latest/
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install --requirement docs/requirements.txt
      - name: Sync repository source pages
        run: node apps/docs-site/scripts/sync-source-docs.mjs
      - name: Build the MkDocs Material site
        run: python -m mkdocs build --strict
      - name: Verify the Read the Docs output
        run: |
          test -f .docs-site/index.html
          test -f .docs-site/sitemap.xml
          test -f .docs-site/stylesheets/streamweld-0.1.0.css
          grep -Fq 'Streamweld documentation - Streamweld' .docs-site/index.html
          grep -Fq 'class="mermaid"' .docs-site/index.html
          grep -Fq 'mermaid.esm.min.mjs' .docs-site/index.html
          grep -Fq 'https://streamweld.readthedocs.io/en/latest/' .docs-site/index.html
