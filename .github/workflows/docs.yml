name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "apps/docs-site/**"
      - "docs/**"
      - "benchmarks/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs-site/**"
      - "docs/**"
      - "benchmarks/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Simulate Read the Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      READTHEDOCS: "True"
      READTHEDOCS_CANONICAL_URL: https://streamweld.readthedocs.io/en/latest/
      READTHEDOCS_LANGUAGE: en
      READTHEDOCS_VERSION: latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the versioned static site
        run: pnpm --filter @streamweld/docs-site run build:astro
      - name: Stage and verify the Read the Docs output
        run: |
          READTHEDOCS_OUTPUT="$RUNNER_TEMP/readthedocs"
          export READTHEDOCS_OUTPUT
          mkdir -p "$READTHEDOCS_OUTPUT/html"
          cp -a apps/docs-site/astro-dist/. "$READTHEDOCS_OUTPUT/html/"
          test -f "$READTHEDOCS_OUTPUT/html/index.html"
          test -f "$READTHEDOCS_OUTPUT/html/sitemap-index.xml"
          grep -Fq 'href="/en/latest/_astro/' "$READTHEDOCS_OUTPUT/html/index.html"
          grep -Fq 'https://streamweld.readthedocs.io/en/latest/og.png' "$READTHEDOCS_OUTPUT/html/index.html"
          ! grep -RqF --include='*.html' '/en/latest//' "$READTHEDOCS_OUTPUT/html"
          if grep -RhE --include='*.html' '(href|src)="/[^"]+"' "$READTHEDOCS_OUTPUT/html" \
            | grep -vE '="/en/latest(/|\")'; then
            echo "Found a root-relative URL that escapes the versioned docs path" >&2
            exit 1
          fi
