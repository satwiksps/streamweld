name: Chaos and benchmarks

on:
  schedule:
    - cron: "43 2 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chaos:
    name: Deterministic chaos suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: helm/kind-action@v1.14.0
        with:
          install_only: true
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v4.0.0
      - run: make chaos GO_TEST_FLAGS=-race
      - name: Run the non-skippable kind matrix
        env:
          STREAMWELD_CHAOS_RESULTS_DIR: ${{ runner.temp }}/streamweld-kind-results
        run: make chaos-kind
      - run: make bench-check
      - run: make bench
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmarks/results.md
            benchmarks/results.json
            ${{ runner.temp }}/streamweld-kind-results/results.md
            ${{ runner.temp }}/streamweld-kind-results/results.json
          if-no-files-found: error
