name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  GOFLAGS: -mod=readonly

jobs:
  go:
    name: Go test, vet, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      STREAMWELD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - name: Test with race detector
        run: make test-go GO_TEST_FLAGS=-race
      - run: make vet
      - run: make build-go

  golangci-lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Check Go formatting
        run: golangci-lint fmt --diff

  typescript:
    name: TypeScript typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: make typecheck
      - run: make test-ts
      - run: make build-ts

  e2e:
    name: kind end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - id: suite
        name: Detect the e2e suite
        shell: bash
        run: |
          if test -d test/e2e && find test/e2e -type f -name '*_test.go' -print -quit | grep -q .; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "The e2e suite is not present in this build phase."
          fi
      - if: steps.suite.outputs.enabled == 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: steps.suite.outputs.enabled == 'true'
        uses: azure/setup-helm@v4.3.1
        with:
          version: v4.0.0
      - if: steps.suite.outputs.enabled == 'true'
        uses: helm/kind-action@v1.14.0
      - if: steps.suite.outputs.enabled == 'true'
        run: make e2e

  packaging:
    name: Helm and Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
      - id: inputs
        name: Detect packaging inputs
        shell: bash
        run: |
          test -f deploy/helm/streamweld/Chart.yaml && echo "helm=true" >> "$GITHUB_OUTPUT" || echo "helm=false" >> "$GITHUB_OUTPUT"
          if test -d infra/terraform && find infra/terraform -type f -name '*.tf' -print -quit | grep -q .; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.inputs.outputs.helm == 'true'
        uses: azure/setup-helm@v4.3.1
        with:
          version: v4.0.0
      - if: steps.inputs.outputs.helm == 'true'
        run: make helm-lint
      - if: steps.inputs.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v4.0.1
      - if: steps.inputs.outputs.terraform == 'true'
        uses: terraform-linters/setup-tflint@v6
      - if: steps.inputs.outputs.terraform == 'true'
        run: make terraform-validate terraform-lint
