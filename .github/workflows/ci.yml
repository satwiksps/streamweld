name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  GOFLAGS: -mod=readonly

jobs:
  go:
    name: Go test, vet, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      STREAMWELD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - name: Test with race detector
        run: make test-go GO_TEST_FLAGS=-race
      - name: Run the committed SSE fuzz seeds
        run: go test -race ./internal/proxy/sse -run=Fuzz -count=1
      - run: make vet
      - run: make build-go

  bench-check:
    name: Benchmark correctness gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: make bench-check

  golangci-lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Check Go formatting
        run: golangci-lint fmt --diff

  typescript:
    name: TypeScript typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: make typecheck
      - run: make test-ts
      - run: make build-ts

  e2e:
    name: kind end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.0.0
      - uses: helm/kind-action@v1.14.0
        with:
          install_only: true
      - run: make e2e

  packaging:
    name: Helm and Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.0.0
      - uses: hashicorp/setup-terraform@v4.0.1
      - uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: v0.64.0
          tflint_config_path: infra/terraform/.tflint.hcl
          cache: true
      - run: make helm-lint terraform-validate terraform-lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
